[project]
name = "pgc-workspace"
version = "0.1.0"
description = "PGC monorepo workspace — Portable GPU Compute"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pgc-core",
    "pgc-rendering",
    "pgc-vis",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.uv.sources]
pgc-core = { workspace = true }
pgc-rendering = { workspace = true }
pgc-vis = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = [
    "packages/pgc-core/tests",
    "packages/pgc-rendering/tests",
    "packages/pgc-vis/tests",
]
