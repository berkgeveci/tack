[project]
name = "pgc-workspace"
version = "0.1.0"
description = "PGC monorepo workspace — Portable GPU Compute"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pgc-core",
    "pgc-rendering",
    "pgc-vis",
    "tack",
]

[project.optional-dependencies]
cpu = ["pgc-core[cpu]"]
cuda = ["pgc-core[cuda]"]
metal = ["pgc-core[metal]"]
hip = ["pgc-core[hip]"]
level_zero = ["pgc-core[level_zero]"]
dev = ["pytest"]

[tool.uv.sources]
pgc-core = { workspace = true }
pgc-rendering = { workspace = true }
pgc-vis = { workspace = true }
tack = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = [
    "packages/pgc-core/tests",
    "packages/pgc-rendering/tests",
    "packages/pgc-vis/tests",
]
