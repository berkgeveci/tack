[project]
name = "tack-workspace"
version = "0.1.0"
description = "Tack monorepo workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tack-core",
    "tack-rendering",
    "tack-vis",
]

[project.optional-dependencies]
cpu = ["tack-core[cpu]"]
cuda = ["tack-core[cuda]"]
metal = ["tack-core[metal]"]
hip = ["tack-core[hip]"]
level_zero = ["tack-core[level_zero]"]
dev = ["pytest"]

[tool.uv.sources]
tack-core = { workspace = true }
tack-rendering = { workspace = true }
tack-vis = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
# The example sweep takes ~1 minute against an 18-second suite, so it is
# deselected by default and run as its own CI job. `pytest -m slow` runs it;
# an explicit -m on the command line overrides this.
addopts = "-m 'not slow'"
markers = [
    "slow: runs every shipped example as a subprocess (see tests/test_examples.py)",
]
testpaths = [
    "packages/tack-core/tests",
    "packages/tack-rendering/tests",
    "packages/tack-vis/tests",
]
