    { name = "cuda-python", marker = "extra == 'cuda'", specifier = ">=13.2.0" },
    { name = "hip-python", marker = "platform_machine == 'x86_64' and sys_platform == 'linux' and extra == 'hip'", specifier = ">=7.0" },
    { name = "llvmlite", marker = "extra == 'cpu'" },
    { name = "numpy" },
    { name = "pyobjc-framework-metal", marker = "extra == 'metal'" },
    { name = "pyobjc-framework-metalkit", marker = "extra == 'metal'" },
    { name = "pytest", marker = "extra == 'dev'" },
    { name = "tack-core", extras = ["cpu", "cuda", "metal", "hip", "level-zero"], marker = "extra == 'all'", editable = "packages/tack-core" },
]
provides-extras = ["cpu", "cuda", "metal", "hip", "level-zero", "dev", "all"]

