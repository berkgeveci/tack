# CI for Tack.
#
# Three jobs, all independent so they report in parallel:
#
#   docs       — builds the site strictly; publishes it from main
#   tests      — the suite on Python 3.11/3.12/3.13 (Linux, CPU backend)
#   ids-i64    — the dataset tests again, every topology with 64-bit ids
#   packaging  — proves a GPU install works without llvmlite
#   examples   — runs every shipped example (deselected from the suite)
#   metal      — the suite on an Apple Silicon runner, with a real GPU
#
# The runners have no NVIDIA or AMD GPU. That is less limiting than it
# sounds: the Metal, CUDA, HIP and Level Zero test files each detect their
# backend at import and skip themselves, while the shared front end (AST
# transform → IR → resolve → type inference → LICM/CSE → type annotation),
# every host-side codegen test, and the subprocess harness that drives the
# GPU backends' dispatch path with stubbed bindings all still run. That is
# the large majority of the suite, in well under a minute.
#
# Real CUDA/HIP coverage needs a self-hosted runner with the hardware
# attached; that would be a fourth job, not a change to these.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch makes the previous run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ───────────────────────────────────────────────────────────
  # Cheapest job here and the one most likely to catch something before a
  # human looks. It found a real bug on its first run: an f-string with a
  # backslash in benchmarks/bench_64mb.py, legal from 3.12
  # and a SyntaxError on 3.11, which the packages declare support for. No
  # test collected that file and the examples job runs 3.13, so nothing
  # here could have caught it. Ruff reads requires-python and did.
  #
  # Lint only, deliberately. `ruff format` would rewrite 182 of 235 files,
  # which is a decision about the whole repository's history rather than
  # something to slip into a lint gate.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Ruff
        run: uvx ruff check --output-format=github .

  # ── Docs ───────────────────────────────────────────────────────────
  #
  # --strict makes a broken internal link or a page missing from the nav a
  # failed build. That is the point of having it in CI at all: H2 in the
  # audit was documentation drift -- a README claiming four backends when
  # there were five, and "40+ examples" against 49 on disk -- and drift is
  # only cheap to fix while it is small.
  #
  # This job checks links and runnable guide examples on pull requests,
  # and packages the site for the GitHub Pages deployment below.

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Sync the docs extra
        run: uv sync --extra docs

      - name: Check tutorial results on CPU
        run: uv run python docs/examples/validate.py --arch cpu

      - name: Build the site
        run: uv run mkdocs build --strict

      # Uploaded on every run, including pull requests, so the packaging
      # step is exercised by the same gate that checks the links rather
      # than only on the push that publishes.
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # ── Publish ────────────────────────────────────────────────────────
  #
  # Separate from the gate above because deploying and checking are
  # different things: every pull request should build the docs, and none
  # of them should be able to publish. Pages has one live site, so this
  # runs only on a push to main.

  docs-publish:
    name: docs (publish)
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Job-level permissions replace the workflow's rather than adding to
    # them, so `contents` is restated. `id-token` is what lets
    # deploy-pages prove to Pages that this run is what it claims to be.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Not the workflow's concurrency group: that one cancels in progress,
    # which is right for a gate and wrong for a deploy — a cancelled
    # deploy can leave the site mid-swap.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # ── The main gate ──────────────────────────────────────────────────
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TACK_REQUIRE_CLANG: "1"
    strategy:
      # Report every version. Without this, one failure cancels the others
      # and hides whether the problem is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          # Sets UV_PYTHON, so `uv sync` and `uv run` agree. Passing
          # --python to sync alone is not enough: `uv run` then falls back
          # to .python-version (3.13) and looks in a different environment.
          python-version: ${{ matrix.python-version }}

      # VTK and MFEM (PyMFEM) are the references for tack.dataset: VTK for the
      # cell shapes, faces and filters, MFEM for the derived topology, the
      # spaces and order 2. One job is enough, and the wheels are large, so
      # only 3.13 syncs the `interop` extra; its versions, and the numba
      # PyMFEM pulls in, come from the lock. TACK_REQUIRE_VTK and
      # TACK_REQUIRE_MFEM make that job fail rather than skip if either is
      # missing or will not import.
      - name: Sync the workspace
        run: >-
          uv sync --extra cpu --extra dev
          ${{ matrix.python-version == '3.13' && '--extra interop' || '' }}

      - name: Require VTK and MFEM, the references for the dataset tests
        if: matrix.python-version == '3.13'
        run: |
          echo "TACK_REQUIRE_VTK=1" >> "$GITHUB_ENV"
          echo "TACK_REQUIRE_MFEM=1" >> "$GITHUB_ENV"

      - name: Check host compiler tooling
        run: >-
          uv run pytest -q -s packages/tack-core/tests/test_compiler_tools.py
          -k test_host_compiler_preflight

      - name: Report which backends this runner has
        run: |
          uv run python - <<'EOF'
          import tack
          found = []
          for arch in ("cpu", "metal", "cuda", "hip", "level_zero"):
              try:
                  tack.set_default_device(arch)
              except Exception:
                  continue
              found.append(arch)
          print("backends available:", ", ".join(found) or "none")
          EOF

      - name: Run the suite
        run: uv run pytest -q

  # ── 64-bit ids ─────────────────────────────────────────────────────
  # tack.dataset keeps a topology's ids in i32 unless it is too large or asked
  # for i64, and its kernels specialize on the id type -- so the i64 path is
  # a second set of compiled kernels that only a huge mesh would reach.
  # `--ids=i64` reruns the dataset tests with every topology built in i64,
  # with VTK and MFEM present so the comparisons run too. Its own job: it
  # repeats the whole dataset suite, which would crowd the main gate.
  ids-i64:
    name: dataset tests with 64-bit ids
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.13"

      - name: Sync the workspace, with VTK and MFEM
        run: uv sync --extra cpu --extra dev --extra interop

      - name: Require VTK and MFEM, the references for the dataset tests
        run: |
          echo "TACK_REQUIRE_VTK=1" >> "$GITHUB_ENV"
          echo "TACK_REQUIRE_MFEM=1" >> "$GITHUB_ENV"

      - name: Run the dataset tests with i64 ids
        run: uv run pytest -q --ids=i64 packages/tack-vis/tests

  # ── Packaging gate ─────────────────────────────────────────────────
  # tack-core's [cuda]/[metal]/[hip]/[level_zero] extras deliberately do not
  # include llvmlite — it is a CPU-only dependency. So a GPU install must
  # never reach tack.runtime.cpu, which imports llvmlite at module scope.
  #
  # This shipped broken once: the GPU backends pulled their shared dispatch
  # helpers from the CPU backend, and GPU users hit ImportError on their
  # first kernel launch. The bug is invisible in any environment that
  # happens to have llvmlite installed — which is every development machine
  # — so it needs its own job with a deliberately minimal install.
  packaging:
    name: GPU install needs no llvmlite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.13"

      - name: Install tack-core with no extras
        run: |
          uv venv /tmp/gpuenv --python 3.13
          VIRTUAL_ENV=/tmp/gpuenv uv pip install ./packages/tack-core pytest

      - name: A GPU backend must import without llvmlite
        run: |
          /tmp/gpuenv/bin/python - <<'EOF'
          import importlib.util, sys
          assert importlib.util.find_spec("llvmlite") is None, \
              "llvmlite is installed — this job proves nothing"
          import tack
          # level_zero_backend binds its driver through ctypes, so it is the
          # one GPU backend importable with no vendor SDK present.
          import tack.runtime.level_zero_backend
          assert "llvmlite" not in sys.modules, \
              "importing a GPU backend dragged in llvmlite"
          print("OK: tack + a GPU backend import cleanly without llvmlite")
          EOF

      - name: Run the isolation guards against that install
        run: |
          /tmp/gpuenv/bin/python -m pytest -q \
            packages/tack-core/tests/test_backend_isolation.py

  # ── Built wheels ───────────────────────────────────────────────────
  # Every other job runs the source tree. This one builds both wheels and
  # installs them in a fresh environment, as a user would, so a packaging
  # mistake (tack-vis shipping its own tack/__init__.py, which runs instead
  # of tack-core's when it comes first) fails here.
  wheels:
    name: Built wheels install and import
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.13"

      - name: Build both wheels
        run: |
          uv build --wheel --out-dir dist packages/tack-core
          uv build --wheel --out-dir dist packages/tack-vis
          python3 - <<'EOF'
          import glob, zipfile
          vis = zipfile.ZipFile(glob.glob("dist/tack_vis-*.whl")[0]).namelist()
          assert "tack/__init__.py" not in vis, "tack-vis's wheel ships tack/__init__.py"
          assert any(n.startswith("tack/dataset/") for n in vis), "no tack.dataset in tack-vis"
          print("OK: tack-vis's wheel is a namespace portion of tack")
          EOF

      - name: Install the wheels in a fresh environment
        run: |
          uv venv /tmp/wheelenv --python 3.13
          VIRTUAL_ENV=/tmp/wheelenv uv pip install "$(ls dist/tack_core-*.whl)[cpu]" \
            dist/tack_vis-*.whl pytest

      - name: Import and run tests from the installed wheels
        run: |
          (cd /tmp && /tmp/wheelenv/bin/python -c "import tack, tack.dataset as td; \
            assert 'site-packages' in tack.__file__, tack.__file__; \
            print(td.contour(td.wavelet(4), 'RTData', 150.0).num_cells, 'triangles')")
          /tmp/wheelenv/bin/python -m pytest -q \
            packages/tack-vis/tests/test_namespace.py \
            packages/tack-vis/tests/test_algorithm_contracts.py

  # ── Examples ───────────────────────────────────────────────────────
  # The shipped examples are the code new users copy, and they exercise
  # combinations the unit tests do not — templates feeding a solver, a
  # dataset filter into VTK. They are deselected from the default
  # suite because the sweep takes about a minute against an 18-second
  # suite, so this is where they actually get run.
  #
  # Examples needing an optional package (matplotlib, vtk, mfem,
  # pydawn) skip themselves with the reason; -rs prints those, so
  # the log says what was really checked rather than just "green".
  examples:
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.13"

      - name: Sync the workspace
        run: uv sync --extra cpu --extra dev

      - name: Run every example
        run: uv run pytest -m slow -q -rs

  # ── Metal ──────────────────────────────────────────────────────────
  # GitHub's macOS runners are Apple Silicon and Metal compute works on
  # them: the first run reported `backends available: cpu, metal` and
  # 938 passed / 44 skipped, matching a local Apple Silicon machine
  # exactly. So this is a real gate, not an experiment — it is the only
  # job that exercises a GPU backend end to end.
  #
  # Metal is required: an unavailable GPU must fail the job before pytest can
  # quietly omit the hardware cases.
  metal:
    name: metal
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TACK_REQUIRE_CLANG: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.13"

      - name: Sync the workspace
        run: uv sync --extra cpu --extra metal --extra dev

      - name: Check host compiler tooling
        run: >-
          uv run pytest -q -s packages/tack-core/tests/test_compiler_tools.py
          -k test_host_compiler_preflight

      - name: Report which backends this runner has
        run: |
          uv run python - <<'EOF'
          import tack
          found = []
          for arch in ("cpu", "metal"):
              try:
                  tack.set_default_device(arch)
              except Exception as e:
                  print(f"{arch}: unavailable ({type(e).__name__})")
                  continue
              found.append(arch)
          print("backends available:", ", ".join(found) or "none")
          EOF

      - name: Run the suite with Metal required
        run: |
          uv run python - <<'EOF'
          import os
          import pytest
          import tack
          from tack.runtime.dispatch import get_backend
          os.environ.pop("TACK_NO_REINIT", None)
          tack.set_default_device("metal")
          assert get_backend().name == "metal"
          print("Required hardware backend: metal", flush=True)
          raise SystemExit(pytest.main(["-q", "-rs"]))
          EOF
