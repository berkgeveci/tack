# Read the Docs build. Versioned URLs and per-PR previews come from here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # uv, because the repo is a uv workspace: the docs extra pulls in
      # tack-core[cpu] so mkdocstrings can import the package it documents.
      # Without the install the build succeeds and renders empty API pages.
      - pip install uv
      - uv sync --extra docs
    build:
      html:
        # --strict turns a broken internal link or an unlisted page into a
        # failed build. Docs rot silently otherwise, and this repo has been
        # caught by exactly that: the README claimed four backends when there
        # were five, and "40+ examples" when there were 49.
        - uv run mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
