          - Sharing Arrays: users-guide/16-interoperability.md
          - Communicate Between Blocks: users-guide/18-communication.md
          - Debugging and Timing: users-guide/15-debugging-and-timing.md
          - The Kernel Cache: users-guide/17-kernel-cache.md
      - Worked Examples:
