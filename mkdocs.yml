site_name: Tack
site_description: Scientific data analysis, visualization and portable GPU compute in Python.
# Published to GitHub Pages, so this is the project-page URL rather than a
# Read the Docs one. It matters beyond cosmetics: canonical tags and the
# generated sitemap are built from it. `.readthedocs.yaml` is still in the
# repo and still correct -- if that is ever connected too, RTD sets its own
# canonical and this stays pointing at the Pages site.
site_url: https://berkgeveci.github.io/tack/
repo_url: https://github.com/berkgeveci/tack
repo_name: berkgeveci/tack
edit_uri: edit/main/docs/

# The guides were written as plain markdown long before this file existed and
# are used as-is. That is why Material is here rather than Sphinx: the 2,800
# lines under docs/ needed no conversion, and tack's docstrings are prose
# rather than Args:/Returns: blocks, so autodoc's structured-parameter
# handling -- the main thing Sphinx would buy -- has almost nothing to act on.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    # Ties every backend tab on the page together: pick CUDA once and every
    # other example on the page follows. Five backends is exactly the case
    # this exists for.
    - content.tabs.link
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/tack-core/src
            - packages/tack-vis/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

# A page left out of the nav is a warning, which --strict makes an error:
# otherwise it builds, unreachable, and nothing says so.
validation:
  nav:
    omitted_files: warn
    not_found: warn

