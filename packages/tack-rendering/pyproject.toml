[project]
name = "tack-rendering"
version = "0.1.0"
description = "Tack — Path tracing renderer"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kitware, Inc." }]
keywords = ["gpu", "compute", "kernel", "jit", "cuda", "metal", "hip", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "tack-core>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tack"]

[tool.hatch.build]
exclude = ["src/tack/__init__.py"]

[project.urls]
Homepage = "https://github.com/Kitware/tack"
Repository = "https://github.com/Kitware/tack"
Documentation = "https://github.com/Kitware/tack/tree/main/docs"
Issues = "https://github.com/Kitware/tack/issues"
