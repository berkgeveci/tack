[project]
name = "tack-rendering"
version = "0.1.0"
description = "Tack — Path tracing renderer"
requires-python = ">=3.11"
dependencies = [
    "tack-core>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tack"]

[tool.hatch.build]
exclude = ["src/tack/__init__.py"]
