[project]
name = "pgc-rendering"
version = "0.1.0"
description = "PGC — Path tracing renderer"
requires-python = ">=3.11"
dependencies = [
    "pgc-core>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgc"]

[tool.hatch.build]
exclude = ["src/pgc/__init__.py"]
