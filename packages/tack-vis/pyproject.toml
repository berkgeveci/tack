[project]
name = "tack-vis"
version = "0.6.0"
description = "Tack — datasets and scientific visualization"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kitware, Inc." }]
keywords = ["gpu", "visualization", "mesh", "finite elements", "vtk", "cuda", "metal", "hip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "tack-core>=0.6.0",
    "unyt>=3.0",
]

[project.optional-dependencies]
# Warp and warp-simdata, for tack.interop.warp (the Warp backend's arrays and
# warp-simdata's datasets). No wheels for Intel macOS.
warp = [
    "tack-core[warp]",
    "warp-simdata>=0.2; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tack"]

[project.urls]
Homepage = "https://github.com/berkgeveci/tack"
Repository = "https://github.com/berkgeveci/tack"
Documentation = "https://berkgeveci.github.io/tack/"
Issues = "https://github.com/berkgeveci/tack/issues"
