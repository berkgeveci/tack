[project]
name = "tack-core"
version = "0.1.0"
description = "Tack — GPU compute framework (core)"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
cpu = [
    "llvmlite",
]
cuda = [
    "cuda-python>=13.2.0",
]
metal = [
    "pyobjc-framework-Metal",
    "pyobjc-framework-MetalKit",
]
hip = []
level_zero = []
dev = [
    "pytest",
]
all = [
    "tack-core[cpu,cuda,metal,hip,level_zero]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tack"]
