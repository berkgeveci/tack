[project]
name = "tack-core"
version = "0.6.1"
description = "Tack — GPU compute framework (core)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kitware, Inc." }]
keywords = ["gpu", "compute", "kernel", "jit", "cuda", "metal", "hip", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
cpu = [
    "llvmlite",
]
cuda = [
    "cuda-python>=13.2.0",
]
metal = [
    "pyobjc-framework-Metal",
    "pyobjc-framework-MetalKit",
]
# hip-python moved from Test PyPI to PyPI proper, so this is a real
# dependency now. It ships manylinux x86_64 wheels only, hence the marker:
# without it, `pip install tack-core[hip]` fails to resolve on macOS and
# Windows instead of quietly installing nothing, which is the friendlier
# outcome given tack.device() already explains what a missing HIP runtime
# means.
#
# Lower bound only. hip-python's version tracks the ROCm release it binds
# to -- 7.1.x against ROCm 7.1, 7.2.x against 7.2 -- so the right version
# is whichever matches the system's ROCm, and pinning one here would be
# guessing at somebody else's install. hip-python 10 (a compatibility
# package over rocm.bindings) is what the bound resolves to today, and
# hip_backend reads its version, runtime library and output structs too.
# mpi4py, for tack.communication across MPI ranks. It builds against the
# system's MPI (mpicc on the path), so it is not part of dev.
mpi = [
    "mpi4py>=4.0",
]
hip = [
    "hip-python>=7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Genuinely empty, and kept rather than deleted so the name stays valid and
# `uv sync --extra level_zero` works. Level Zero is reached through ctypes
# to libze_loader.so and libocloc.so, which are system libraries from the
# Intel compute runtime; there is no Python package to depend on.
level_zero = []
# NVIDIA Warp, for the prototype Warp backend (tack.device("warp")). Its
# wheels are for Linux, Windows and Apple silicon; none for Intel macOS.
warp = [
    "warp-lang>=1.18; sys_platform != 'darwin' or platform_machine == 'arm64'",
]
dev = [
    "pytest",
]
all = [
    "tack-core[cpu,cuda,metal,hip,level_zero]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tack"]

[project.urls]
Homepage = "https://github.com/berkgeveci/tack"
Repository = "https://github.com/berkgeveci/tack"
Documentation = "https://berkgeveci.github.io/tack/"
Issues = "https://github.com/berkgeveci/tack/issues"
