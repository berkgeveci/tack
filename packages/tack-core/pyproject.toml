[project]
name = "tack-core"
version = "0.1.0"
description = "Tack — GPU compute framework (core)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kitware, Inc." }]
keywords = ["gpu", "compute", "kernel", "jit", "cuda", "metal", "hip", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
cpu = [
    "llvmlite",
]
cuda = [
    "cuda-python>=13.2.0",
]
metal = [
    "pyobjc-framework-Metal",
    "pyobjc-framework-MetalKit",
]
# Deliberately empty, and kept rather than deleted so the names stay valid
# and `uv sync --extra hip` works in the workspace. Neither backend's
# requirement can be expressed as a pip dependency: hip-python is published
# on Test PyPI, and Level Zero needs system libraries. tack.init() prints the
# real instructions when either backend fails to start; see the README.
hip = []
level_zero = []
dev = [
    "pytest",
]
all = [
    "tack-core[cpu,cuda,metal,hip,level_zero]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tack"]

[project.urls]
Homepage = "https://github.com/berkgeveci/tack"
Repository = "https://github.com/berkgeveci/tack"
Documentation = "https://github.com/berkgeveci/tack/tree/main/docs"
Issues = "https://github.com/berkgeveci/tack/issues"
